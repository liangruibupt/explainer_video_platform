  im.onerror = () => ok(); im.src = BG; }) : Promise.resolve();
const SCENES = [
{ id: "title_card", title: "LLM 推理的两个阶段：Prefill 与 Decode", draw: (() => { function draw(ctx, f, n, W, H, T) {
  const p = f / n;
  const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const ease = t => 1 - Math.pow(1 - cl(t), 3);
  const back = t => { t = cl(t); const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); };
  const hash = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

  // floating token squares in background
  const tokTxt = ['the', 'is', 'AI', 'to', '模型', 'tok', '的', 'KV', 'a', '生成', 'of', '推理'];
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < 12; i++) {
    const s = 70 + hash(i) * 60;
    const sp = 0.6 + hash(i + 20) * 0.8;
    const x = hash(i + 40) * W + Math.sin(f * 0.02 * sp + i) * 40;
    let y = (hash(i + 60) * H * 0.84 - f * sp * 1.2) % (H * 0.84);
    if (y < 0) y += H * 0.84;
    ctx.save();
    ctx.globalAlpha = 0.12 * ease(f / 30);
    ctx.translate(x, y); ctx.rotate(Math.sin(f * 0.015 + i) * 0.3);
    ctx.strokeStyle = i % 2 ? T.accent : T.accent2; ctx.lineWidth = 3;
    rr(-s / 2, -s / 2, s, s, 14); ctx.stroke();
    ctx.fillStyle = T.ink; ctx.font = `${Math.round(s * 0.32)}px ${T.font}`;
    ctx.fillText(tokTxt[i], 0, 0);
    ctx.restore();
  }

  // title: char-by-char pop
  const lines = ['LLM 推理的', '两个阶段'];
  const fs = Math.round(H * 0.068);
  ctx.font = `bold ${fs}px ${T.font}`;
  let k = 0; const total = lines.join('').length;
  lines.forEach((ln, li) => {
    const chars = [...ln];
    const ws = chars.map(c => ctx.measureText(c).width);
    let x = W / 2 - ws.reduce((a, b) => a + b, 0) / 2;
    const y = H * 0.2 + li * fs * 1.25;
    chars.forEach((c, ci) => {
      const t0 = 0.03 + (k / total) * 0.3;
      const s = back((p - t0) / 0.06);
      if (s > 0) {
        ctx.save();
        ctx.translate(x + ws[ci] / 2, y);
        ctx.scale(s, s); ctx.globalAlpha = cl(s);
        ctx.fillStyle = li === 1 ? T.accent : T.ink;
        ctx.fillText(c, 0, 0);
        ctx.restore();
      }
      x += ws[ci]; k++;
    });
  });

  // subtitle + underline
  const sa = ease((p - 0.33) / 0.1);
  ctx.globalAlpha = sa;
  ctx.fillStyle = T.dim; ctx.font = `${Math.round(H * 0.032)}px ${T.font}`;
  ctx.fillText('一次回答，两种性格', W / 2, H * 0.36 + (1 - sa) * 30);
  ctx.strokeStyle = T.accent; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(W / 2 - 160 * sa, H * 0.395); ctx.lineTo(W / 2 + 160 * sa, H * 0.395); ctx.stroke();
  ctx.globalAlpha = 1;

  // two blocks
  const bw = 400, bh = 380, by = H * 0.5;
  const block = (x, col, a, b, t0, idx) => {
    const s = back((p - t0) / 0.1);
    if (s <= 0) return;
    const bob = Math.sin(f * 0.06 + idx * 1.5) * 8 * cl((p - t0 - 0.1) / 0.1);
    ctx.save();
    ctx.translate(x + bw / 2, by + bh / 2 + bob); ctx.scale(s, s); ctx.globalAlpha = cl(s);
    ctx.shadowColor = col; ctx.shadowBlur = 30 + 15 * Math.sin(f * 0.08 + idx);
    ctx.fillStyle = col; rr(-bw / 2, -bh / 2, bw, bh, 40); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = T.bg;
    ctx.font = `bold ${Math.round(H * 0.04)}px ${T.font}`; ctx.fillText(a, 0, -50);
    ctx.font = `${Math.round(H * 0.034)}px ${T.font}`; ctx.fillText(b, 0, 55);
    ctx.restore();
  };
  const lx = W / 2 - 50 - bw, rx = W / 2 + 50;
  block(lx, T.accent, 'Prefill', '预填充', 0.42, 0);
  block(rx, T.accent2, 'Decode', '解码', 0.68, 1);

  // arrow between blocks
  const at = ease((p - 0.58) / 0.12);
  if (at > 0) {
    const ay = by + bh / 2, x0 = lx + bw + 8, x1 = rx - 8;
    const xe = x0 + (x1 - x0) * at;
    ctx.strokeStyle = T.ink; ctx.fillStyle = T.ink; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(x0, ay); ctx.lineTo(xe, ay); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(xe + 4, ay); ctx.lineTo(xe - 14, ay - 12); ctx.lineTo(xe - 14, ay + 12); ctx.closePath(); ctx.fill();
  }

  // token stream under blocks (keeps motion late in scene)
  const ta = ease((p - 0.78) / 0.1);
  if (ta > 0) {
    ctx.globalAlpha = ta;
    const yy = H * 0.76;
    for (let i = 0; i < 8; i++) {
      const sz = 54, gx = 110 + i * 112;
      const on = (f * 0.08 - i) % 8;
      const lit = on >= 0 && on < 1.2;
      ctx.fillStyle = i < 4 ? T.accent : T.accent2;
      ctx.globalAlpha = ta * (lit ? 1 : 0.35);
      rr(gx - sz / 2, yy - sz / 2 - (lit ? 10 : 0), sz, sz, 12); ctx.fill();
    }
    ctx.globalAlpha = ta;
    ctx.fillStyle = T.dim; ctx.font = `${Math.round(H * 0.03)}px ${T.font}`;
    ctx.fillText('读入提示词  →  逐个生成 token', W / 2, yy + 90);
    ctx.globalAlpha = 1;
  }
}
 return draw; })() },
{ id: "request_lifecycle", title: "一次请求的全过程", draw: (() => { function draw(ctx, f, n, W, H, T) {
  const p = f / n;
  const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const seg = (a, b) => cl((p - a) / (b - a));
  const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const back = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  const ORANGE = '#F28C28', PURPLE = '#8E5CF7', GREEN = '#2DBE6C', BLUE = '#3B82F6', GRAY = '#9AA0A6';
  function rr(x, y, w, h, r, fill, stroke, lw) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 4; ctx.stroke(); }
  }
  function txt(s, x, y, size, col, align, bold) {
    ctx.font = (bold ? 'bold ' : '') + size + 'px ' + T.font; ctx.fillStyle = col;
    ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
  }
  function arrow(x1, y1, x2, y2, col) {
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    const a = Math.atan2(y2 - y1, x2 - x1);
    ctx.beginPath(); ctx.moveTo(x2 + 6 * Math.cos(a), y2 + 6 * Math.sin(a));
    ctx.lineTo(x2 - 26 * Math.cos(a - 0.45), y2 - 26 * Math.sin(a - 0.45));
    ctx.lineTo(x2 - 26 * Math.cos(a + 0.45), y2 - 26 * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();
  }
  // Title
  ctx.globalAlpha = seg(0, 0.06);
  txt('一次请求的全过程', W / 2, 140, 68, T.ink, 'center', true);
  ctx.globalAlpha = 1;
  // Step 1: prompt tokens slide into Prefill
  const boxA = seg(0.04, 0.12);
  const slide = ease(seg(0.14, 0.28));
  const absorb = seg(0.27, 0.32);
  ctx.globalAlpha = seg(0.03, 0.08) * (1 - slide);
  txt('提示词', W / 2, 235, 40, T.dim);
  ctx.globalAlpha = 1;
  for (let i = 0; i < 6; i++) {
    const a = seg(0.03 + i * 0.012, 0.08 + i * 0.012);
    if (a <= 0 || absorb >= 1) continue;
    const y = 280 + slide * 215 + (1 - a) * -40;
    ctx.globalAlpha = a * (1 - absorb);
    rr(190 + i * 120, y, 100, 100, 16, GRAY);
  }
  ctx.globalAlpha = boxA;
  const glow = absorb * (1 - seg(0.32, 0.4));
  rr(140, 440, 800, 200, 28, glow > 0 ? 'rgba(242,140,40,' + (0.25 * glow) + ')' : null, ORANGE, 6 + glow * 6);
  txt('Prefill', 540, 395 + 0 * 0, 1, ORANGE);
  ctx.globalAlpha = boxA * (slide < 0.5 ? 1 : 1 - absorb * 0.5);
  txt('Prefill', 540, 540, 64, ORANGE, 'center', true);
  ctx.globalAlpha = boxA * absorb;
  txt('一次性处理全部输入', 540, 605, 32, T.dim);
  ctx.globalAlpha = 1;
  // Decode cycles
  const D0 = 0.5, D1 = 0.9, CY = 4, cyc = (D1 - D0) / CY;
  let done = 0, curT = -1;
  if (p >= D0) { const k = Math.floor((p - D0) / cyc); done = Math.min(CY, k); curT = k < CY ? ((p - D0) - k * cyc) / cyc : -1; }
  // Step 2: KV cache bar
  const kvA = ease(seg(0.32, 0.42));
  if (kvA > 0) {
    arrow(540, 645, 540, 645 + 45 * kvA, ORANGE);
    let cells = 6 * kvA + done + (curT > 0.8 ? ease((curT - 0.8) / 0.2) : 0);
    const cw = 60, w = cells * cw;
    rr(140, 700, Math.max(w, 2), 70, 14, PURPLE);
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 3;
    for (let i = 1; i < cells; i++) { ctx.beginPath(); ctx.moveTo(140 + i * cw, 708); ctx.lineTo(140 + i * cw, 762); ctx.stroke(); }
    ctx.globalAlpha = kvA;
    txt('KV Cache', 140 + w + 24, 735, 40, PURPLE, 'left', true);
    ctx.globalAlpha = 1;
  }
  // first output token
  const o1 = seg(0.4, 0.47);
  const slotX = i => 140 + i * 115;
  if (o1 > 0) {
    const s = back(o1);
    ctx.save(); ctx.translate(slotX(0) + 45, 845); ctx.scale(s, s);
    rr(-45, -45, 90, 90, 16, GREEN); ctx.restore();
    ctx.globalAlpha = o1;
    txt('↑ 第 1 个 token', 140, 925, 36, GREEN, 'left', true);
    ctx.globalAlpha = 1;
  }
  // Step 3: Decode loop
  const dA = seg(0.44, 0.52);
  if (dA > 0) {
    ctx.globalAlpha = dA;
    rr(140, 980, 800, 440, 28, null, BLUE, 6);
    txt('Decode 循环', 540, 1035, 56, BLUE, 'center', true);
    txt('每步只生成 1 个 token', 540, 1385, 34, T.dim);
    const cx = 540, cy = 1210, r = 115;
    const rot = p * Math.PI * 2 * 3 + (curT >= 0 ? curT * Math.PI * 2 : 0);
    ctx.strokeStyle = BLUE; ctx.lineWidth = 10; ctx.beginPath();
    ctx.arc(cx, cy, r, rot, rot + Math.PI * 1.6); ctx.stroke();
    const e = rot + Math.PI * 1.6;
    const hx = cx + r * Math.cos(e), hy = cy + r * Math.sin(e);
    arrow(hx - 10 * Math.cos(e + Math.PI / 2), hy - 10 * Math.sin(e + Math.PI / 2), hx, hy, BLUE);
    txt('步 ' + Math.min(CY, done + (curT >= 0 ? 1 : 0)) + '/' + CY, cx, cy, 40, T.ink, 'center', true);
    // read / append arrows to KV
    const pul = 0.5 + 0.5 * Math.sin(f * 0.25);
    ctx.globalAlpha = dA * (0.5 + 0.5 * pul);
    arrow(820, 975, 820, 790, PURPLE);
    txt('读取 + 追加', 800, 880, 32, PURPLE, 'right', true);
    ctx.globalAlpha = 1;
    // emitted tokens
    for (let i = 0; i < CY; i++) {
      let x = slotX(i + 1), y = 800, a = 1;
      if (i < done) { }
      else if (i === done && curT >= 0.25) {
        const t = ease(cl((curT - 0.25) / 0.55));
        x = (cx - 45) + (x - cx + 45) * t; y = (cy - 45) + (800 - cy + 45) * t; a = cl((curT - 0.25) / 0.1);
      } else continue;
      ctx.globalAlpha = a; rr(x, y, 90, 90, 16, GREEN); ctx.globalAlpha = 1;
    }
  }
  // End marker
  const eA = seg(0.9, 0.95);
  if (eA > 0) {
    arrow(540, 1425, 540, 1425 + 50 * eA, BLUE);
    const s = back(eA) * (1 + 0.04 * Math.sin(f * 0.2));
    ctx.save(); ctx.translate(540, 1530); ctx.scale(s, s);
    rr(-150, -50, 300, 100, 50, T.ink);
    txt('结束 ✓', 0, 0, 48, T.bg, 'center', true);
    ctx.restore();
  }
}
 return draw; })() },
{ id: "prefill_compute_bound", title: "Prefill：计算密集", draw: (() => { function draw(ctx, f, n, W, H, T) {
  const p = f / n;
  const cl = v => Math.max(0, Math.min(1, v));
  const ease = v => { v = cl(v); return 1 - Math.pow(1 - v, 3); };
  const font = (s, b) => (ctx.font = (b ? "bold " : "") + s + "px " + T.font);
  const text = (s, x, y, sz, col, al, b) => {

  // Title

  grids.forEach((g, k) => {

    for (let i = 0; i < g.r; i++) for (let j = 0; j < g.c; j++) {
      const cx = g.x + j * cw, cy = gy + i * ch;
      rr(cx + 3, cy + 3, (cw - 6) * a, ch - 6, 6);
      ctx.fillStyle = T.dim; ctx.globalAlpha = a * 0.35; ctx.fill();
      if (light > 0) {
        const sh = 0.75 + 0.25 * Math.sin(f * 0.25 + i * 0.9 + j * 1.3 + k);
        ctx.globalAlpha = light * sh * (k === 2 ? 1 : 0.8);

  });

    text(Math.round(v * 100) + "%", 990, y, 58, col, "right", true);
    rr(90, y + 50, 900, 70, 35); ctx.fillStyle = T.dim; ctx.globalAlpha = a * 0.3; ctx.fill();
    ctx.globalAlpha = a;

    ctx.globalAlpha = 1;
  };
  const jit = Math.sin(f * 0.3) * 0.01;
  const cu = ease((p - 0.36) / 0.1) * 0.96 + (p > 0.46 ? jit : 0);
  bar(920, "GPU 算力利用率", cu, cu > 0.8 ? T.accent : T.ink, 0.33);
  const bw = ease((p - 0.42) / 0.18) * 0.45 + (p > 0.6 ? jit * 0.7 : 0);
  bar(1100, "显存带宽", bw, T.dim, 0.4);

  // TTFT timer

  if (tA > 0) {
    ctx.globalAlpha = tA;

    text("TTFT 首 token 延迟", 255, cy, 62, T.ink, "left", true);

    ctx.fillStyle = T.ink; ctx.beginPath(); ctx.arc(x0, ay, 14, 0, Math.PI * 2); ctx.fill();
    text("请求到达", x0 + 10, 1565, 58, T.ink, "left");
    const xe = x0 + (x1 - x0) * ar;

 return draw; })() },
{ id: "decode_memory_bound", title: "Decode：访存密集", draw: (() => { function draw(ctx, f, n, W, H, T) {
  const p = f / n;
  const cl = (x, a, b) => Math.max(a, Math.min(b, x));
  const ease = t => { t = cl(t, 0, 1); return t * t * (3 - 2 * t); };
  const seg = (a, b) => ease((p - a) / (b - a));
  const font = (s, w) => { ctx.font = (w || '') + ' ' + s + 'px ' + T.font; };
  const rr = (x, y, w, h, r, fill, stroke, lw) => {
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 4; ctx.stroke(); }
  };
  const text = (s, x, y, size, col, al, w) => {
    font(size, w); ctx.fillStyle = col; ctx.textAlign = al || 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);

  const green = T.accent2 || '#3fb950';

  ctx.globalAlpha = 1;

  // Memory warehouse
  const m = seg(0.03, 0.15);
  const mx = 80, my = 240, mw = W - 160, mh = 400;
  ctx.globalAlpha = m;
  rr(mx, my, mw, mh, 30, null, T.dim, 5);
  text('显存', mx + 40, my + 55, 62, T.dim, 'left', 'bold');
  // weights block
  rr(mx + 40, my + 110, 520, 250, 20, T.accent, null);
  ctx.globalAlpha = m * 0.9;
  for (let i = 1; i < 5; i++) { ctx.fillStyle = T.bg; ctx.fillRect(mx + 40, my + 110 + i * 50, 520, 3); }
  ctx.globalAlpha = m;
  text('模型权重', mx + 300, my + 235, 64, T.bg, 'center', 'bold');
  // KV cache growing
  const kvGrow = 0.15 + 0.85 * cl((p - 0.1) / 0.9, 0, 1);
  const kvMaxH = 250, kvH = kvMaxH * kvGrow;
  rr(mx + 600, my + 110, 300, kvMaxH, 20, null, T.dim, 3);
