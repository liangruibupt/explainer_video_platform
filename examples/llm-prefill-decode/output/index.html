<script>
const DUR = [370, 452, 426, 500, 541, 699, 325]; const FPS = 30; const W = 1080, H = 1920;
const T = {bg:'#141210', ink:'#f4ede4', dim:'#9a8f85', accent:'#e0603f', accent2:'#7fb0c8',
  font:'"Noto Sans CJK SC","PingFang SC",sans-serif'};
const ctx = document.getElementById('c').getContext('2d');
const BG = "";
const bgReady = BG ? new Promise((ok) => { const im = new Image(); im.onload = () => { T.bg_img = im; ok(); };
  im.onerror = () => ok(); im.src = BG; }) : Promise.resolve();
const SCENES = [
{ id: "title_card", title: "LLM 推理的两个阶段：Prefill 与 Decode", draw: (() => { function draw(ctx, f, n, W, H, T) {
  const p = f / n;
  const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const ease = t => { t = cl(t); return 1 - Math.pow(1 - t, 3); };
  const seg = (a, b) => ease((p - a) / (b - a));
  const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); };
  const font = (s, w = '') => { ctx.font = `${w} ${Math.round(s)}px ${T.font}`; };
  const text = (s, x, y, size, col, a = 1, w = 'bold', al = 'center') => {
    ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = col; font(size, w); ctx.textAlign = al; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y); ctx.restore();
  };
  const safe = H * 0.84;

  // background falling tokens
  for (let i = 0; i < 28; i++) {
    const s = 34 + (i * 37) % 40;
    const x = ((i * 397) % (W - 80)) + 40;
    const sp = 1.2 + (i % 5) * 0.5;
    const span = safe + 200;
    const y = ((i * 211) % span + f * sp) % span - 100;
    ctx.save();
    ctx.globalAlpha = 0.10 + (i % 3) * 0.04;
    ctx.strokeStyle = i % 4 === 0 ? T.accent : i % 4 === 1 ? T.accent2 : T.dim;
    ctx.lineWidth = 3;
    ctx.translate(x, y); ctx.rotate(Math.sin(f * 0.01 + i) * 0.3);
    rr(-s / 2, -s / 2, s, s, 8); ctx.stroke();
    ctx.restore();
  }

  // title char by char
  const title = 'LLM 推理的两个阶段';
  const ts = H * 0.05;
  font(ts, 'bold');
  const chars = [...title];
  const widths = chars.map(c => ctx.measureText(c).width);
  const total = widths.reduce((a, b) => a + b, 0);
  let x = W / 2 - total / 2;
  const ty = H * 0.2;
  chars.forEach((c, i) => {
    const t = ease((p * n - 8 - i * 7) / 18);
    text(c, x + widths[i] / 2, ty + (1 - t) * 40, ts, T.ink, t, 'bold');
    x += widths[i];
  });
  // underline
  const ul = seg(0.25, 0.4);
  ctx.fillStyle = T.accent; rr(W / 2 - total / 2, ty + ts * 0.75, total * ul, 8, 4); ctx.fill();
  text('Prefill 与 Decode', W / 2, ty + ts * 1.6, H * 0.034, T.dim, seg(0.28, 0.4), '');

  // pills slide in
  const pw = 440, ph = 140, py = H * 0.38;
  const pill = (cx, label, sub, col, t) => {
    ctx.save(); ctx.globalAlpha = cl(t * 1.5);
    ctx.fillStyle = col; rr(cx - pw / 2, py - ph / 2, pw, ph, ph / 2); ctx.fill();
    ctx.restore();
    text(label, cx, py - 22, H * 0.034, T.bg, cl(t * 1.5));
    text(sub, cx, py + 30, H * 0.026, T.bg, cl(t * 1.5), '');
  };
  const tl = seg(0.3, 0.45), tr = seg(0.35, 0.5);
  const bob = Math.sin(f * 0.06) * 6;
  pill(-pw + (W * 0.27 + pw) * tl, 'Prefill', '预填充', T.accent, tl);
  pill(W + pw - (W * 0.27 + pw) * tr, 'Decode', '解码', T.accent2, tr);

  // mini illustration
  const da = seg(0.5, 0.58);
  const bs = 72, gap = 14;
  const rowX = W / 2 - (6 * (bs + gap) - gap) / 2;
  // prefill row: all at once
  const y1 = H * 0.53;
  text('Prefill：整段输入一次并行处理', W / 2, y1 - 70, H * 0.03, T.ink, da, '');
  const fill1 = seg(0.58, 0.64);
  for (let i = 0; i < 6; i++) {
    const bx = rowX + i * (bs + gap);
    ctx.save(); ctx.globalAlpha = da;
    ctx.strokeStyle = T.accent; ctx.lineWidth = 4; rr(bx, y1, bs, bs, 12); ctx.stroke();
    ctx.globalAlpha = da * fill1 * 0.85; ctx.fillStyle = T.accent; rr(bx, y1, bs, bs, 12); ctx.fill();
    ctx.restore();
  }
  // scan beam over prefill
  if (fill1 > 0 && fill1 < 1) {
    ctx.save(); ctx.globalAlpha = 0.5 * (1 - fill1); ctx.fillStyle = T.accent;
    rr(rowX - 10, y1 - 10, 6 * (bs + gap) + 6, bs + 20, 18); ctx.fill(); ctx.restore();
  }
  // decode row: one by one
  const y2 = H * 0.68;
  const db = seg(0.62, 0.68);
  text('Decode：一次只生成一个 token', W / 2, y2 - 70, H * 0.03, T.ink, db, '');
  const k = cl((p - 0.66) / 0.2) * 6;
  for (let i = 0; i < 6; i++) {
    const bx = rowX + i * (bs + gap);
    const t = cl(k - i);
    ctx.save(); ctx.globalAlpha = db * 0.35;
    ctx.strokeStyle = T.dim; ctx.lineWidth = 3; ctx.setLineDash([8, 8]); rr(bx, y2, bs, bs, 12); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = db * t;
    ctx.fillStyle = T.accent2; rr(bx, y2 + (1 - t) * -30, bs, bs, 12); ctx.fill();
    ctx.restore();
  }
  // arrow between rows
  const ax = W / 2, aT = seg(0.6, 0.66);
  ctx.save(); ctx.globalAlpha = aT; ctx.strokeStyle = T.dim; ctx.fillStyle = T.dim; ctx.lineWidth = 5;
  const ay0 = y1 + bs + 18, ay1 = ay0 + (y2 - 110 - ay0) * aT;
  ctx.beginPath(); ctx.moveTo(ax, ay0); ctx.lineTo(ax, ay1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ax - 14, ay1 - 14); ctx.lineTo(ax, ay1 + 4); ctx.lineTo(ax + 14, ay1 - 14); ctx.fill();
  ctx.restore();

  // closing question
  const q = seg(0.85, 0.95);
  text('为什么要把它们分开？', W / 2, H * 0.78 + (1 - q) * 30 + bob * q * 0.5, H * 0.04, T.accent, q);
}
 return draw; })() },
{ id: "request_lifecycle", title: "一次请求的全过程", draw: (() => { function draw(ctx, f, n, W, H, T) {
  const p = f / n;
  const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const ph = (a, b) => cl((p - a) / (b - a));
  const ez = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const back = t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  const GREEN = '#3bb273';
  const fnt = (s, b) => `${b ? 'bold ' : ''}${Math.round(s)}px ${T.font}`;
  function rr(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function box(x, y, w, h, col, label, a, glow) {
    if (a <= 0) return;
    ctx.save(); ctx.globalAlpha = a;
    if (glow) { ctx.shadowColor = col; ctx.shadowBlur = glow; }
    rr(x, y, w, h, 24); ctx.fillStyle = col + '22'; ctx.fill();
    ctx.lineWidth = 6; ctx.strokeStyle = col; ctx.stroke(); ctx.shadowBlur = 0;
    ctx.fillStyle = col; ctx.font = fnt(H * 0.045, 1); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, x + w / 2, y + h / 2); ctx.restore();
  }
  function tok(cx, cy, s, col, label, a) {
    if (a <= 0 || s <= 0) return;
    ctx.save(); ctx.globalAlpha = a; rr(cx - s / 2, cy - s / 2, s, s, 14);
    ctx.fillStyle = col; ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = fnt(s * 0.38, 1); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, cx, cy + 2); ctx.restore();
  }
  function arrow(x1, y1, x2, y2, t, col) {
    if (t <= 0) return;
    const x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t, an = Math.atan2(y2 - y1, x2 - x1);
    ctx.save(); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + Math.cos(an) * 6, y + Math.sin(an) * 6);
    ctx.lineTo(x - Math.cos(an - 0.5) * 30, y - Math.sin(an - 0.5) * 30);
    ctx.lineTo(x - Math.cos(an + 0.5) * 30, y - Math.sin(an + 0.5) * 30); ctx.fill(); ctx.restore();
  }
  // title
  const ta = ez(ph(0, 0.06));
  ctx.save(); ctx.globalAlpha = ta; ctx.fillStyle = T.ink; ctx.font = fnt(H * 0.06, 1);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('一次请求的全过程', W / 2, 150 - (1 - ta) * 30);
  ctx.fillStyle = T.dim; ctx.font = fnt(H * 0.03);
  ctx.fillText('提示词 → Prefill → Decode', W / 2, 235); ctx.restore();
  // layout
  const S = 90, G = 14, X0 = 80, PB = { x: 80, y: 560, w: 640, h: 200 }, DB = { x: 80, y: 1000, w: 640, h: 180 };
  const slotX = i => X0 + S / 2 + i * (S + G);
  // prompt tokens
  ctx.fillStyle = T.dim; ctx.font = fnt(H * 0.03); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = ph(0.05, 0.1) * (1 - ph(0.2, 0.26)); ctx.fillText('提示词 tokens', X0, 320); ctx.globalAlpha = 1;
  const fall = ez(ph(0.2, 0.31));
  for (let i = 0; i < 6; i++) {
    const ap = back(ph(0.06 + i * 0.018, 0.12 + i * 0.018));
    const cy = 420 + fall * (PB.y + PB.h / 2 - 420);
    tok(slotX(i) + 40, cy, S * ap * (1 - 0.5 * fall), '#8a8f98', 't' + (i + 1), fall >= 1 ? 0 : 1);
  }
  // prefill box
  const pulse = ph(0.3, 0.46) > 0 && p < 0.46 ? 30 + 20 * Math.sin(f * 0.4) : 0;
  box(PB.x, PB.y, PB.w, PB.h, T.accent, 'Prefill', ez(ph(0.12, 0.2)), pulse);
  if (p > 0.31) { ctx.fillStyle = T.dim; ctx.font = fnt(H * 0.03); ctx.textAlign = 'center';
    ctx.globalAlpha = ph(0.31, 0.36); ctx.fillText('一次性处理全部输入', PB.x + PB.w / 2, PB.y + PB.h - 35); ctx.globalAlpha = 1; }
  // KV cache container
  const KX = 820, KY = 560, KW = 150, CH = 50, KA = ez(ph(0.32, 0.37));
  if (KA > 0) {
    ctx.save(); ctx.globalAlpha = KA;
    ctx.fillStyle = GREEN; ctx.font = fnt(H * 0.03, 1); ctx.textAlign = 'center';
    ctx.fillText('KV Cache', KX + KW / 2, KY - 40);
    rr(KX, KY, KW, 14 * CH * KA, 18); ctx.lineWidth = 5; ctx.strokeStyle = GREEN; ctx.stroke();
    ctx.restore();
    arrow(PB.x + PB.w + 8, PB.y + PB.h / 2, KX - 10, PB.y + PB.h / 2, ez(ph(0.33, 0.38)), GREEN);
  }
  let cells = 0;
  for (let i = 0; i < 6; i++) cells += ez(ph(0.36 + i * 0.012, 0.39 + i * 0.012));
  const st = k => [0.53 + k * 0.075, 0.53 + (k + 1) * 0.075];
  for (let k = 0; k < 5; k++) { const [a, b] = st(k); cells += ez(cl((p - (a + b) / 2) / (b - a) * 3)); }
  for (let i = 0; i < 11; i++) {
    const fr = cl(cells - i); if (fr <= 0) break;
    ctx.save(); ctx.globalAlpha = 0.85; rr(KX + 12, KY + 10 + i * CH, (KW - 24) * fr, CH - 10, 8);
    ctx.fillStyle = GREEN; ctx.fill(); ctx.restore();
  }
  // first token
  ctx.fillStyle = T.dim; ctx.font = fnt(H * 0.03); ctx.textAlign = 'left';
  ctx.globalAlpha = ph(0.48, 0.53); ctx.fillText('输出 tokens', X0, 1290); ctx.globalAlpha = 1;
  const ft = back(ph(0.4, 0.46)), mv = ez(ph(0.48, 0.54));
  tok(PB.x + PB.w / 2 + (slotX(0) - PB.x - PB.w / 2) * mv, 880 + (1385 - 880) * mv, S * ft, T.accent, 'o1', 1);
  if (p > 0.4 && p < 0.48) { ctx.fillStyle = T.accent; ctx.font = fnt(H * 0.03, 1); ctx.textAlign = 'left';
    ctx.globalAlpha = ph(0.41, 0.44); ctx.fillText('第一个 token', PB.x + PB.w / 2 + 70, 880); ctx.globalAlpha = 1; }
  arrow(PB.x + PB.w / 2 - 120, PB.y + PB.h + 10, PB.x + PB.w / 2 - 120, DB.y - 12, ez(ph(0.44, 0.5)), T.dim);
  // decode box + loop
  const ended = p >= 0.91;
  box(DB.x, DB.y, DB.w, DB.h, T.accent2, 'Decode', ez(ph(0.46, 0.52)), 0);
  if (p > 0.52) {
    const cx = DB.x + DB.w - 70, cy = DB.y + DB.h / 2, r = 42, rot = ended ? 0 : f * 0.18;
    ctx.save(); ctx.globalAlpha = ended ? 0.35 : 1; ctx.strokeStyle = T.accent2; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.arc(cx, cy, r, rot, rot + Math.PI * 1.5); ctx.stroke();
    const ea = rot + Math.PI * 1.5; ctx.fillStyle = T.accent2; ctx.beginPath();
    ctx.arc(cx + Math.cos(ea) * r, cy + Math.sin(ea) * r, 10, 0, 7); ctx.fill(); ctx.restore();
    ctx.fillStyle = T.dim; ctx.font = fnt(H * 0.03); ctx.textAlign = 'left';
    ctx.fillText('每步只生成 1 个', DB.x + 30, DB.y + DB.h - 30);
  }
  for (let k = 0; k < 5; k++) {
    const [a, b] = st(k), t = cl((p - a) / (b - a));
    if (t <= 0) continue;
    const pop = back(cl(t * 2.5)), m = ez(cl((t - 0.35) / 0.5));
    const sx = DB.x + DB.w / 2, sy = DB.y + DB.h / 2;
    tok(sx + (slotX(k + 1) - sx) * m, sy + (1385 - sy) * m, S * pop, T.accent2, 'o' + (k + 2), 1);
  }
  // end badge
  if (ended) {
    const e = back(ph(0.91, 0.96)), pu = 1 + 0.05 * Math.sin(f * 0.25);
    const bx = slotX(6) + 70, by = 1385;
    ctx.save(); ctx.translate(bx, by); ctx.scale(e * pu, e * pu);
    rr(-75, -45, 150, 90, 45); ctx.fillStyle = T.ink; ctx.fill();
    ctx.fillStyle = T.bg; ctx.font = fnt(H * 0.032, 1); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('结束', 0, 2); ctx.restore();
  }
}
 return draw; })() },
{ id: "prefill_compute_bound", title: "Prefill：计算密集", draw: (() => { function draw(ctx, f, n, W, H, T) {
  const p = f / n;
  const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const ease = x => { x = cl(x); return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
  const seg = (a, b) => ease((p - a) / (b - a));
  const txt = (s, x, y, size, col, align = 'center', bold = false) => {
    ctx.font = (bold ? 'bold ' : '') + size + 'px ' + T.font;
    ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.fillText(s, x, y);
  };
  const rr = (x, y, w, h, r, fill, stroke) => {
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 3; ctx.stroke(); }
  };
  const RED = '#e5484d';

  // Title
  const tA = seg(0, 0.06);
  ctx.globalAlpha = tA;
  txt(T.title || 'Prefill：计算密集', W / 2, 150 - (1 - tA) * 30, 72, T.ink, 'center', true);
  txt('所有输入 token 一起做矩阵乘法', W / 2, 240, 40, T.dim);
  ctx.globalAlpha = 1;

  // Matrix grid + tokens
  const R = 8, C = 8, cs = 70, gx = 360, gy = 330;
  const tokIn = seg(0.06, 0.2);
  const q = cl((p - 0.2) / 0.16);
  // grid frame
  ctx.globalAlpha = seg(0.03, 0.1);
  txt('权重矩阵', gx + C * cs / 2, gy - 40, 36, T.dim);
  txt('Token', 190, gy - 40, 36, T.dim);
  ctx.globalAlpha = 1;
  for (let r = 0; r < R; r++) {
    for (let c = 0; c < C; c++) {
      const x = gx + c * cs, y = gy + r * cs;
      const th = (c + (r % 3) * 0.4) / (C + 1);
      const lit = cl((q - th) * 6);
      rr(x + 4, y + 4, cs - 8, cs - 8, 8, null, T.dim);
      if (lit > 0) {
        const pulse = 0.75 + 0.25 * Math.sin(f * 0.18 + r * 0.7 + c * 0.5);
        ctx.globalAlpha = lit * pulse;
        rr(x + 4, y + 4, cs - 8, cs - 8, 8, T.accent);
        ctx.globalAlpha = 1;
      }
    }
    // token squares all arriving together
    const tx = -120 + (160 - -120) * tokIn;
    const ty = gy + r * cs;
    rr(tx, ty + 6, 58, 58, 10, T.accent2 || T.accent);
    txt('t' + (r + 1), tx + 29, ty + 35, 30, T.bg, 'center', true);
    // streaming arrows into grid
    if (tokIn >= 1) {
      ctx.strokeStyle = T.accent; ctx.lineWidth = 4;
      ctx.setLineDash([14, 12]); ctx.lineDashOffset = -f * 2;
      ctx.beginPath(); ctx.moveTo(228, ty + 35); ctx.lineTo(gx - 10, ty + 35); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = T.accent; ctx.beginPath();
      ctx.moveTo(gx - 4, ty + 35); ctx.lineTo(gx - 20, ty + 26); ctx.lineTo(gx - 20, ty + 44); ctx.fill();
    }
  }
  ctx.globalAlpha = seg(0.3, 0.38);
  txt('并行度高 · 成片同时计算', W / 2, gy + R * cs + 50, 40, T.accent, 'center', true);
  ctx.globalAlpha = 1;

  // Gauges
  const gauge = (label, y, target, col, a, b) => {
    const k = seg(a, b);
    ctx.globalAlpha = seg(a - 0.04, a);
    const jit = k >= 1 ? 0.015 * Math.sin(f * 0.3 + y) : 0;
    const v = cl(target * k + jit);
    txt(label, 120, y, 42, T.ink, 'left', true);
    txt(Math.round(v * 100) + '%', 960, y, 42, col, 'right', true);
    rr(120, y + 35, 840, 54, 27, null, T.dim);
    if (v > 0.01) rr(124, y + 39, 832 * v, 46, 23, col);
    ctx.globalAlpha = 1;
  };
  const hot = seg(0.5, 0.56);
  const compCol = hot > 0.5 ? RED : T.accent;
  gauge('GPU 算力利用率', 1010, 0.96, compCol, 0.4, 0.52);
  gauge('显存带宽', 1150, 0.45, T.dim, 0.46, 0.58);
  if (hot > 0) {
    ctx.globalAlpha = hot * (0.6 + 0.4 * Math.sin(f * 0.25));
    txt('计算密集型 🔥', 960, 960, 36, RED, 'right', true);
    ctx.globalAlpha = 1;
  }

  // Timeline
  const ta = seg(0.62, 0.68);
  ctx.globalAlpha = ta;
  const ly = 1440, x0 = 140, x1 = 700;
  ctx.strokeStyle = T.dim; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(x0, ly); ctx.lineTo(950, ly); ctx.stroke();
  ctx.fillStyle = T.dim; ctx.beginPath();
  ctx.moveTo(965, ly); ctx.lineTo(945, ly - 12); ctx.lineTo(945, ly + 12); ctx.fill();
  ctx.fillStyle = T.ink; ctx.beginPath(); ctx.arc(x0, ly, 14, 0, 7); ctx.fill();
  txt('请求到达', x0, ly + 55, 38, T.ink);
  const run = seg(0.68, 0.82);
  const dx = x0 + (x1 - x0) * run;
  ctx.fillStyle = T.accent; ctx.beginPath(); ctx.arc(dx, ly, 14 + 3 * Math.sin(f * 0.3), 0, 7); ctx.fill();
  ctx.globalAlpha = ta * seg(0.8, 0.84);
  rr(x1 - 30, ly - 30, 60, 60, 10, T.accent);
  txt('第一个 token', x1, ly + 55, 38, T.accent, 'center', true);
  // bracket
  const br = seg(0.84, 0.92);
  ctx.globalAlpha = br;
  const by = ly - 70;
  ctx.strokeStyle = T.accent; ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(x0, by + 25); ctx.lineTo(x0, by);
  ctx.lineTo(x0 + (x1 - x0) * br, by);
  if (br >= 1) ctx.lineTo(x1, by + 25);
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo((x0 + x1) / 2, by); ctx.lineTo((x0 + x1) / 2, by - 18); ctx.stroke();
  const bob = 4 * Math.sin(f * 0.15);
  txt('TTFT 首 token 延迟', (x0 + x1) / 2, by - 55 + bob, 46, T.accent, 'center', true);
  ctx.globalAlpha = 1;
}
 return draw; })() },
{ id: "decode_memory_bound", title: "Decode：访存密集", draw: (() => { function draw(ctx, f, n, W, H, T) {
